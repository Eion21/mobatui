# GoReleaser: binarios para linux/darwin/windows + .deb/.rpm + tap de
# Homebrew y bucket de Scoop. Publica por tag (vX.Y.Z) desde GitHub
# Actions; el changelog sale de los Conventional Commits del rango.
version: 2

project_name: mobatui

builds:
  - id: mobatui
    main: .
    binary: mobatui
    env:
      - CGO_ENABLED=0
    # -trimpath elimina las rutas absolutas del binario: sin él, dos
    # compilaciones del mismo commit producen hashes distintos y los
    # manifiestos publicados apuntarían a un SHA que no coincide con el
    # artefacto real. Verificado: sin -trimpath, el hash cambia entre
    # ejecuciones; con él, es estable.
    flags:
      - -trimpath
    # Fecha fija en los archivos empaquetados: sin esto cada ejecución
    # produce un .tar.gz con mtime distinto y, por tanto, un SHA-256
    # distinto. Los manifiestos apuntarían a un hash que no coincide con
    # el artefacto publicado. Verificado.
    mod_timestamp: '{{ .CommitTimestamp }}'
    # {{.Version}} ya viene sin la "v" del tag. Inyectarla hace que
    # `mobatui --version` anuncie la versión real aunque los metadatos
    # VCS del build digan "+dirty".
    ldflags:
      - -s -w
      - -X github.com/Eion21/mobatui/internal/version.injected={{ .Version }}
      # SHA completo del commit: sin esto el binario publicado anunciaba
      # "commit: (desconocido)", porque GoReleaser no compila con
      # vcs.revision.
      - -X github.com/Eion21/mobatui/internal/version.injectedCommit={{ .FullCommit }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: render
    main: ./cmd/render
    binary: mobatui-render
    env:
      - CGO_ENABLED=0
    # -trimpath elimina las rutas absolutas del binario: sin él, dos
    # compilaciones del mismo commit producen hashes distintos y los
    # manifiestos publicados apuntarían a un SHA que no coincide con el
    # artefacto real. Verificado: sin -trimpath, el hash cambia entre
    # ejecuciones; con él, es estable.
    flags:
      - -trimpath
    # Fecha fija en los archivos empaquetados: sin esto cada ejecución
    # produce un .tar.gz con mtime distinto y, por tanto, un SHA-256
    # distinto. Los manifiestos apuntarían a un hash que no coincide con
    # el artefacto publicado. Verificado.
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  # Un archivo por binario: mobatui se publica en 5 plataformas y
  # mobatui-render solo en las de amd64. GoReleaser rechaza un archivo
  # que mezcle binarios con distinto número de plataformas.
  - id: mobatui
    ids:
      - mobatui
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # WinGet y Scoop NO aceptan .tar.gz: sus manifiestos declaran un
    # instalador portable y esperan .zip. Solo se cambia Windows; el
    # resto de plataformas conserva el .tar.gz de siempre, así que las
    # URLs ya publicadas siguen siendo válidas.
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: render
    ids:
      - render
    name_template: >-
      {{ .ProjectName }}-render_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Arch }}
    maintainer: Eion21 <eiones21@gmail.com>
    description: MOBA builds and stats for Deadlock and League of Legends in your terminal
    homepage: https://github.com/Eion21/mobatui
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: README.md
        dst: /usr/share/doc/mobatui/README.md

# ---------------------------------------------------------------------
# Gestores de paquetes
#
# Los tres se generan desde los artefactos ya publicados.
#
# SEGURIDAD: el workflow de release los SALTA con
#   --skip=winget,scoop,homebrew
# de modo que publicar la release nunca depende de que un gestor externo
# responda. La actualización de manifiestos es un workflow aparte que se
# ejecuta a mano (workflow_dispatch) y solo escribe en sus repositorios.
#
# NO se usa skip_upload con plantilla: sprig no está disponible, y
# {{ .Env.X }} sin la variable definida ABORTA la release entera
# (verificado: "map has no entry for key"). Un fallo de un gestor de
# paquetes no puede tumbar la publicación de los binarios.
# ---------------------------------------------------------------------

# Homebrew Cask para macOS: instala el binario precompilado, sin compilar
# desde fuente. Ambos arquitecturas salen del mismo Cask.
homebrew_casks:
  - name: mobatui
    ids:
      - mobatui
    repository:
      owner: Eion21
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/Eion21/mobatui
    description: MOBA builds and stats for Deadlock and League of Legends in your terminal
    license: MIT
    # SEGURO POR DEFECTO: no escribe en el tap salvo que el workflow de
    # publicación lo active con .goreleaser-publish.yaml. Este valor es
    # estático a propósito (nunca una plantilla: {{ .Env.X }} sin la
    # variable definida aborta la release entera).
    skip_upload: true
    # SIN hooks. El binario no está firmado ni notarizado, así que macOS
    # lo marcará en cuarentena y el primer arranque mostrará el diálogo de
    # Gatekeeper. Eso es VISIBLE y el usuario decide.
    #
    # Quitar com.apple.quarantine automáticamente (xattr -dr) silenciaría
    # ese control de seguridad: el usuario instalaría sin ver la
    # advertencia. No se hace por defecto. Ver docs/PACKAGING.md §2 para
    # las tres alternativas y cuál se recomienda.


# Scoop para Windows: manifiesto JSON en un bucket propio.
scoops:
  - name: mobatui
    ids:
      - mobatui
    repository:
      owner: Eion21
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: https://github.com/Eion21/mobatui
    description: MOBA builds and stats for Deadlock and League of Legends in your terminal
    license: MIT
    skip_upload: true


# WinGet: genera los manifiestos de versión, instalador y locale, y abre
# un PR contra microsoft/winget-pkgs. NO se envía solo: exige el token de
# un fork con permiso para abrir PRs en el repositorio de Microsoft.
winget:
  - name: mobatui
    ids:
      - mobatui
    package_identifier: Eion21.MOBATUI
    package_name: MOBA TUI
    publisher: Eion21
    license: MIT
    short_description: MOBA builds and stats for Deadlock and League of Legends in your terminal
    description: >-
      Terminal UI for browsing Deadlock and League of Legends builds:
      item routes, skill order, runes, matchups and win-rate statistics
      ranked by Wilson score.
    homepage: https://github.com/Eion21/mobatui
    license_url: https://github.com/Eion21/mobatui/blob/master/LICENSE
    publisher_url: https://github.com/Eion21
    publisher_support_url: https://github.com/Eion21/mobatui/issues
    # Seguro por defecto, igual que cask y scoop.
    skip_upload: true
    tags:
      - gaming
      - league-of-legends
      - deadlock
      - tui
      - cli
    repository:
      owner: Eion21
      name: winget-pkgs
      branch: master
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
        draft: true


checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
