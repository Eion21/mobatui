# GoReleaser: binarios para linux/darwin/windows + .deb/.rpm + tap de
# Homebrew y bucket de Scoop. Publica por tag (vX.Y.Z) desde GitHub
# Actions; el changelog sale de los Conventional Commits del rango.
version: 2

project_name: mobatui

builds:
  - id: mobatui
    main: .
    binary: mobatui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: render
    main: ./cmd/render
    binary: mobatui-render
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Arch }}
    maintainer: Eion21 <eiones21@gmail.com>
    description: MOBA builds and stats for Deadlock and League of Legends in your terminal
    homepage: https://github.com/Eion21/mobatui
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: README.md
        dst: /usr/share/doc/mobatui/README.md

# Homebrew y Scoop quedan fuera hasta que existan los repositorios tap y
# bucket: GoReleaser falla si el repositorio destino no existe.

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
