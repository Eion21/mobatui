name: Publish packages

# Publica los manifiestos de Homebrew, Scoop y WinGet de una release YA
# publicada.
#
# ---------------------------------------------------------------------
# SECUENCIA
#
#   0. Validar    tag publicado, no borrador; inventario de assets.
#   1. Generar    goreleaser -f .goreleaser-publish.yaml con
#                 SKIP_PACKAGE_UPLOAD=true  -> solo escribe en dist/
#   2. Verificar  pkgcheck contra los assets REALES de la release
#   3. Publicar   MISMA config, SKIP_PACKAGE_UPLOAD=false, --fail-fast
#   4. Comprobar  la GitHub Release no cambió
#
# EQUIVALENCIA ENTRE LO VERIFICADO Y LO PUBLICADO
#
#   La fase 3 NO reutiliza los manifiestos de la fase 1: GoReleaser los
#   regenera al ejecutarse de nuevo. No existe un subcomando para
#   publicar artefactos ya generados (artifacts.json se escribe pero
#   nunca se relee; publishAll filtra ctx.Artifacts en memoria).
#
#   Ambas fases usan EL MISMO archivo de configuración y solo cambia
#   SKIP_PACKAGE_UPLOAD, así que la generación es determinista: mismos
#   inputs, misma versión, mismos artefactos. La reproducibilidad se
#   apoya en mod_timestamp y -trimpath (en .goreleaser-publish.yaml).
#
#   LIMITE: esto es determinismo empírico, no una garantía por
#   construcción. Por eso el paso "Assert published manifests equal
#   verified ones" compara los sha256 en tiempo de ejecución y falla si
#   difieren.
#
# POR QUÉ --skip=publish NO SE USA EN LA FASE 3
#
#   cask, scoop y winget viven DENTRO de la fase de publicación
#   (internal/pipe/publish/publish.go). --skip=publish los omitiría
#   también, dejando un no-op silencioso.
#
# PUBLICACIÓN PARCIAL: NO ES ATÓMICA
#
#   --fail-fast evita que se intente el siguiente gestor tras un error,
#   pero NO revierte lo ya escrito. Verificado: si Homebrew publica y
#   Scoop falla, Homebrew queda publicado y el job termina en error.
#   La recuperación es reejecutar con --skip=<gestor ya publicado>. Ver
#   docs/PACKAGING.md §13.
# ---------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ya publicado (ej. v0.2.1)"
        required: true
        type: string
      targets:
        description: "Gestores a publicar"
        required: true
        default: "homebrew,scoop"
        type: choice
        options:
          - "homebrew,scoop"
          - "homebrew,scoop,winget"
          - "homebrew"
          - "scoop"
          - "winget"

# Permisos mínimos sobre ESTE repositorio: solo leer. Sin contents:write
# este workflow no puede modificar la release, los binarios ni los tags.
# La escritura ocurre en otros repositorios con tokens propios.
permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      # Checkout del TAG solicitado, no del ref por defecto.
      #
      # Sin 'ref', actions/checkout toma el ref del evento: en un
      # workflow_dispatch eso es el master del momento. Si se publicaban
      # manifiestos para v0.2.1, se generaban desde el código de master, y
      # el binario resultante no era el del tag. Aquí se fija el ref y se
      # verifica que HEAD sea exactamente el commit del tag.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ---------------------------------------------------------------
      # 0. Validaciones previas
      # ---------------------------------------------------------------
      # Verifica, en este orden:
      #   1. El tag tiene formato vX.Y.Z.
      #   2. HEAD es EXACTAMENTE el commit de ese tag (no master).
      #   3. La GitHub Release existe y no es borrador.
      #   4. El commit del tag coincide con el que anuncia la release.
      - name: Verify tag exists and matches HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # vX.Y.Z exacto: 'v1.2' o 'v1' colarían con un patrón laxo y
          # luego fallarían de forma confusa al no existir la release.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::el tag '$TAG' no tiene el formato vX.Y.Z"
            exit 1
          fi

          # El tag debe existir en el clon. actions/checkout con ref de tag
          # crea un HEAD desacoplado, así que se compara por SHA.
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::el tag $TAG no existe en el repositorio"; exit 1; }

          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "HEAD:      $HEAD_SHA"
          echo "tag $TAG:  $TAG_SHA"
          test "$HEAD_SHA" = "$TAG_SHA" || {
            echo "::error::HEAD ($HEAD_SHA) no es el commit del tag $TAG ($TAG_SHA)."
            echo "::error::Se publicarían manifiestos generados desde otro commit."
            exit 1
          }

          # La release no puede ser un borrador.
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets \
            --jq '"tag=\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets|length)"'
          DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          test "$DRAFT" = "false" || { echo "::error::la release $TAG es un borrador"; exit 1; }

          # El commit de la release debe ser el del tag.
          REL_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REL_SHA}"                    --jq '.object.sha' 2>/dev/null)" = "$TAG_SHA" ] 2>/dev/null; then
            echo "etiqueta anotada: $REL_SHA -> $TAG_SHA"
          elif [ "$REL_SHA" != "$TAG_SHA" ]; then
            echo "::error::la release $TAG apunta a $REL_SHA, pero el tag resuelve a $TAG_SHA"
            exit 1
          fi
          echo "tag y HEAD coinciden en $TAG_SHA"

      - name: Snapshot release state (before)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/before
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' | sort > /tmp/before/assets.txt
          echo "assets antes: $(wc -l < /tmp/before/assets.txt)"
          gh release download "$TAG" --pattern checksums.txt --dir /tmp/before
          test -s /tmp/before/checksums.txt || { echo "::error::checksums.txt vacío o ausente"; exit 1; }
          sort /tmp/before/checksums.txt > /tmp/checksums.before
          echo "checksums antes: $(wc -l < /tmp/checksums.before)"

      - name: Require tokens for selected targets
        env:
          TARGETS: ${{ inputs.targets }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          MISSING=0
          need() {
            local name="$1" val="$2" target="$3"
            case ",$TARGETS," in
              *",$target,"*)
                if [ -z "${val:-}" ]; then
                  echo "::error::$name no está configurado y se pidió $target"
                  MISSING=1
                fi ;;
            esac
          }
          need HOMEBREW_TAP_TOKEN "$HOMEBREW_TAP_TOKEN" homebrew
          need SCOOP_BUCKET_TOKEN "$SCOOP_BUCKET_TOKEN" scoop
          need WINGET_TOKEN "$WINGET_TOKEN" winget
          test "$MISSING" = "0" || { echo "::error::faltan tokens; no se genera ni se publica nada"; exit 1; }
          echo "tokens presentes para: $TARGETS"

      # ---------------------------------------------------------------
      # 1. GENERAR — escribe solo en dist/ porque skip_upload es true
      #    en el config por defecto.
      # ---------------------------------------------------------------
      # Los --skip de gestores se calculan ANTES de generar, porque la
      # fase 1 y la fase 3 deben usar EXACTAMENTE el mismo conjunto.
      #
      # Si la generación produjera los tres manifiestos y la publicación
      # solo los seleccionados, --clean borraría los no publicados y la
      # comparación final fallaría por archivos ausentes (o, peor, se
      # compararían conjuntos distintos).
      - name: Compute skip list
        id: skip
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          SKIP=""
          for t in homebrew scoop winget; do
            case ",$TARGETS," in
              *",$t,"*) : ;;
              *) SKIP="$SKIP,$t" ;;
            esac
          done
          SKIP="${SKIP#,}"
          echo "value=${SKIP}" >> "$GITHUB_OUTPUT"
          echo "gestores seleccionados: $TARGETS"
          echo "gestores omitidos: '${SKIP:-ninguno}'"

      - name: Generate manifests (local only)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          # MISMA configuración Y MISMOS --skip de gestor que la fase de
          # publicación. Solo cambia SKIP_PACKAGE_UPLOAD, que vale true
          # aquí: los manifiestos se escriben en dist/ y no se toca ningún
          # repositorio destino.
          #
          # Compartir ambos es lo que hace comparables las dos fases: se
          # generan exactamente los manifiestos que se van a publicar.
          args: >-
            release --clean -f .goreleaser-publish.yaml --skip=publish,validate${{ steps.skip.outputs.value != '' && format(',{0}', steps.skip.outputs.value) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKIP_PACKAGE_UPLOAD: "true"
          # Tokens vacíos en esta fase: aunque skip_upload fallara, no hay
          # credenciales con las que escribir en un repo destino.
          HOMEBREW_TAP_TOKEN: ""
          SCOOP_BUCKET_TOKEN: ""
          WINGET_TOKEN: ""

      - name: Assert nothing was published in generation phase
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          # La fase de generación no debe haber creado dist/git/ (clone de
          # un repo destino) ni haber escrito nada fuera de dist/.
          if [ -d dist/git ]; then
            echo "::error::se clonó un repositorio destino durante la generación"
            ls -la dist/git
            exit 1
          fi

          # Solo se exigen los manifiestos de los gestores seleccionados:
          # pedir los tres aquí rompía targets=homebrew, scoop o winget.
          CHECKED=0
          case ",$TARGETS," in
            *",homebrew,"*)
              test -f dist/homebrew/Casks/mobatui.rb \
                || { echo "::error::no se generó el Cask"; exit 1; }
              CHECKED=$((CHECKED+1)) ;;
          esac
          case ",$TARGETS," in
            *",scoop,"*)
              test -f dist/scoop/bucket/mobatui.json \
                || { echo "::error::no se generó el manifiesto de Scoop"; exit 1; }
              CHECKED=$((CHECKED+1)) ;;
          esac
          case ",$TARGETS," in
            *",winget,"*)
              test -n "$(find dist/winget -name '*.yaml' -type f 2>/dev/null)" \
                || { echo "::error::no se generaron los manifiestos de WinGet"; exit 1; }
              CHECKED=$((CHECKED+1)) ;;
          esac

          echo "manifiestos generados en dist/ para $CHECKED gestor(es), ningún repo destino tocado"

      # ---------------------------------------------------------------
      # 2. VERIFICAR — antes de cualquier escritura remota.
      # ---------------------------------------------------------------
      - name: Verify manifests against published assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          # -targets: se verifican SOLO los gestores seleccionados. Los
          # omitidos no tienen manifiesto en esta ejecución, así que
          # exigirlos daría un falso fallo (era el caso por defecto
          # homebrew,scoop, que no genera WinGet).
          #
          # La verificación de assets NO se desactiva: -require-assets
          # sigue en true, de modo que cada URL se compara con un asset
          # real de la release y con su sha256.
          go run -tags packages ./cmd/pkgcheck \
            -tag "$TAG" -dist dist -repo "$GITHUB_REPOSITORY" \
            -targets "$TARGETS"

      # Guarda los hashes de lo verificado para compararlos con lo que la
      # fase 3 genere y publique.
      # Lista de manifiestos SOLO de los gestores seleccionados.
      #
      # Antes se listaban las tres rutas siempre: con targets=homebrew,scoop
      # la fase de publicación omite winget, --clean borra sus archivos y
      # la comparación fallaba por algo que nunca se iba a publicar.
      - name: Record verified manifest hashes
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified
          : > /tmp/verified/files.txt
          case ",$TARGETS," in
            *",homebrew,"*) echo "homebrew/Casks/mobatui.rb" >> /tmp/verified/files.txt ;;
          esac
          case ",$TARGETS," in
            *",scoop,"*) echo "scoop/bucket/mobatui.json" >> /tmp/verified/files.txt ;;
          esac
          case ",$TARGETS," in
            *",winget,"*) find dist/winget -name '*.yaml' -type f \
                             | sed 's|^dist/||' >> /tmp/verified/files.txt ;;
          esac

          test -s /tmp/verified/files.txt || {
            echo "::error::ningún manifiesto para los targets '$TARGETS'"
            exit 1
          }

          # Deben existir AHORA: si falta uno, el problema es de generación.
          MISSING=0
          while read -r f; do
            [ -f "dist/$f" ] || { echo "::error::falta dist/$f"; MISSING=1; }
          done < /tmp/verified/files.txt
          test "$MISSING" = "0" || exit 1

          while read -r f; do sha256sum "dist/$f"; done < /tmp/verified/files.txt \
            | sed 's|dist/||' | sort > /tmp/verified/hashes.txt
          echo "manifiestos verificados ($(wc -l < /tmp/verified/files.txt)):"
          cat /tmp/verified/hashes.txt

      # Sobre VERIFICAR: si pkgcheck falla, el workflow se detiene AQUÍ y
      # el paso de publicación nunca se ejecuta. Ningún repositorio externo
      # recibe nada.

      # ---------------------------------------------------------------
      # 3. Calcular qué gestores se omiten en la publicación.
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # 3. PUBLICAR — solo si la verificación pasó.
      # ---------------------------------------------------------------
      - name: Publish manifests to package repositories
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          # Config de publicación: skip_upload: false + release.disable.
          #
          # NO se pasa --skip=publish: cask, scoop y winget viven DENTRO
          # de esa fase, así que omitirla dejaría el workflow en un no-op
          # silencioso. Lo que evita tocar GitHub es release.disable en el
          # propio archivo de configuración.
          #
          # Los gestores no seleccionados se omiten con --skip=<gestor>,
          # que se añade más abajo.
          # --fail-fast es imprescindible: cask, scoop y winget declaran
          # ContinueOnError, así que sin él GoReleaser continúa con el
          # siguiente gestor aunque el anterior falle, dejando escrituras
          # parciales. Con --fail-fast, el primer error aborta el resto.
          # Verificado: con un destino roto, sin --fail-fast Scoop sí
          # escribía; con --fail-fast, no.
          args: >-
            release --clean -f .goreleaser-publish.yaml --fail-fast
            --skip=validate,chocolatey,aur,aur-source,nix,krew,snapcraft,flatpak,srpm${{ steps.skip.outputs.value != '' && format(',{0}', steps.skip.outputs.value) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Aquí sí se escribe: mismos manifiestos, ya verificados.
          SKIP_PACKAGE_UPLOAD: "false"
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      # ---------------------------------------------------------------
      # 3b. EQUIVALENCIA — la fase 3 REGENERA los manifiestos (GoReleaser
      # no tiene un subcomando para publicar artefactos ya generados:
      # artifacts.json se escribe pero nunca se relee). Por tanto la
      # equivalencia NO es por construcción: se comprueba aquí.
      #
      # Se fija mod_timestamp y -trimpath para que la generación sea
      # determinista, y este paso verifica que coincide con lo validado.
      # Si difieren, el job falla aunque la publicación haya funcionado.
      # ---------------------------------------------------------------
      - name: Assert published manifests equal verified ones
        run: |
          set -euo pipefail
          MISSING=0
          while read -r f; do
            [ -f "dist/$f" ] || { echo "::error::falta dist/$f tras publicar"; MISSING=1; }
          done < /tmp/verified/files.txt
          test "$MISSING" = "0" || {
            echo "::error::la fase de publicación no generó los manifiestos esperados"
            exit 1
          }

          while read -r f; do sha256sum "dist/$f"; done < /tmp/verified/files.txt \
            | sed 's|dist/||' | sort > /tmp/verified/after.txt
          if ! diff -u /tmp/verified/hashes.txt /tmp/verified/after.txt; then
            echo "::error::los manifiestos publicados NO coinciden con los verificados"
            echo "::error::revisa los cambios de configuración entre fases"
            exit 1
          fi
          echo "manifiestos publicados == verificados (sha256 idénticos, $(wc -l < /tmp/verified/files.txt) archivos)"

      # ---------------------------------------------------------------
      # 4. COMPROBAR — la GitHub Release es idéntica.
      # ---------------------------------------------------------------
      - name: Assert release unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/after
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' | sort > /tmp/after/assets.txt
          gh release download "$TAG" --pattern checksums.txt --dir /tmp/after
          sort /tmp/after/checksums.txt > /tmp/after/checksums.sorted
          diff -u /tmp/before/assets.txt /tmp/after/assets.txt || {
            echo "::error::la lista de assets de la release CAMBIÓ"; exit 1; }
          diff -u /tmp/checksums.before /tmp/after/checksums.sorted || {
            echo "::error::checksums.txt de la release CAMBIÓ"; exit 1; }
          echo "release $TAG sin cambios: mismos assets y mismos checksums"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifests-${{ inputs.tag }}
          path: |
            dist/winget/**
            dist/homebrew/**
            dist/scoop/**
          retention-days: 7
          if-no-files-found: warn
